# =============================================
# hyprlock.conf — Lock screen configuration
# Palette: black-white-ish (from colors.toml)
# =============================================

# ----- General -----
general {
    hide_cursor = true
    grace = 3
    ignore_empty_input = true
}

# ----- Authentication -----
auth {
    pam:enabled = true
    fingerprint:enabled = false
}

# ----- Animations -----
animations {
    enabled = true
    bezier = quint, 0.23, 1, 0.32, 1
    animation = fade, 1, 2, quint
    animation = inputField, 1, 2, quint
}

# =============================================
# Background — wallpaper darkened + blur
# =============================================
background {
    monitor =
    path = /home/antoine/Dev/other/Swayfxdotfiles/walls/black-white-ish/3-climb.jpg
    blur_passes = 3
    blur_size = 6
    noise = 0.02
    contrast = 0.9
    brightness = 0.35
    vibrancy = 0.1
    vibrancy_darkness = 0.3
}

# =============================================
# Time — top-center clock
# =============================================
label {
    monitor =
    text = $TIME
    color = rgba(202, 204, 204, 1.0)
    font_size = 150
    font_family = Monocraft

    position = 0, 300
    halign = center
    valign = center
}

# =============================================
# Input field — below clock, theme colors
# =============================================
input-field {
    monitor =
    size = 360, 50
    outline_thickness = 2

    # accent → #798186, gradient to #cacccc like active border
    outer_color = rgba(121, 129, 134, 0.8) rgba(202, 204, 204, 0.5) 45deg
    # background → #101315
    inner_color = rgba(16, 19, 21, 0.9)
    # foreground → #cacccc
    font_color = rgba(202, 204, 204, 1.0)
    font_family = Monocraft

    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = 0

    fade_on_empty = true
    fade_timeout = 3000
    placeholder_text =
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    rounding = 0

    # green → #9fa5a9
    check_color = rgba(159, 165, 169, 0.9)
    # bright_red → #de6145
    fail_color = rgba(222, 97, 69, 0.9)
    # yellow → #d9dbdc
    capslock_color = rgba(217, 219, 220, 0.8)

    shadow_passes = 1
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, -80
    halign = center
    valign = center
}

# =============================================
# Keyboard layout (hidden if default)
# =============================================
label {
    monitor =
    text = $LAYOUT[!]
    color = rgba(75, 78, 85, 0.6)
    font_size = 12
    font_family = Monocraft

    position = 0, -105
    halign = center
    valign = center
}
