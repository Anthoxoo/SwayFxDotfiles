general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
}

# --- FOND D'ÉCRAN & FLOU ---
background {
    monitor =
    # Utilise ton fond d'écran (remplace par screenshot si tu préfères flouter tes fenêtres ouvertes)
    path = /home/antoine/.config/walls/yellow-orange-ish/wall_secondary.png
    color = rgba(141416ff)

    # Réglages du flou et assombrissement type Omarchy
    blur_passes = 3
    blur_size = 6
    noise = 0.0117
    contrast = 0.9000
    brightness = 0.6500
    vibrancy = 0.1696
}

# --- HORLOGE PRINCIPALE ---
label {
    monitor =
    text = 
    color = rgba(e5e5e5ff)
    font_size = 86
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 130
    halign = center
    valign = center
}

# --- DATE (en Orange #ff8800) ---
label {
    monitor =
    text = cmd[update:43200000] LC_TIME=fr_FR.UTF-8 date +%A %d %B %Y
    color = rgba(ff8800ff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 45
    halign = center
    valign = center
}

# --- UTILISATEUR ---
label {
    monitor =
    text = 󰌾  antoine
    color = rgba(8a8a8dff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -35
    halign = center
    valign = center
}

# --- CHAMP DE MOT DE PASSE ---
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2

    # Style des points de saisie
    dots_size = 0.25
    dots_spacing = 0.30
    dots_center = true

    # 0 = angles carrés stricts (mets 6 si tu veux de légers arrondis)
    rounding = 0

    # Palette Omarchy : fond #141416, bordure orange #ff8800, texte #e5e5e5
    outer_color = rgba(ff8800ff)
    inner_color = rgba(141416e6)
    font_color = rgba(e5e5e5ff)
    font_family = JetBrainsMono Nerd Font

    # Couleurs de validation / erreur / Caps Lock
    check_color = rgba(e5e5e5ff)
    fail_color = rgba(e05252ff)
    capslock_color = rgba(ffaa00ff)

    fade_on_empty = false
    # Note : le double ## est obligatoire dans hyprlock pour le Pango markup
    placeholder_text = <i><span foreground=##6e6e70>Mot de passe...</span></i>
    fail_text = <i> <b>()</b></i>

    position = 0, -90
    halign = center
    valign = center
}


# --- LECTEUR MÉDIA (Deezer / Playerctl en bas d'écran) ---
label {
    monitor =
    text = cmd[update:2000] sh -c 'a=; t=; [ -n  ] && echo 󰎆 — '
    color = rgba(ff8800cc)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}

