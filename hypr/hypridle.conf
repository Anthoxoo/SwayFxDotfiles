# =============================================
# hypridle.conf — Idle management for Hyprland
# Locks screen on idle + before sleep (lid close)
# =============================================

general {
    # Lock via loginctl (triggers hyprlock via lock_cmd)
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# =============================================
# Listener 1 — Dim screen after 2.5 minutes
# =============================================
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# =============================================
# Listener 2 — Lock screen after 5 minutes
# =============================================
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# =============================================
# Listener 3 — Turn off display after 5.5 min
# =============================================
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# =============================================
# Listener 4 — Suspend after 30 minutes
# =============================================
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
