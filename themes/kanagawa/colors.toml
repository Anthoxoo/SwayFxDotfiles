# Kanagawa (Wave variant) — palette from rebelot/kanagawa.nvim
name = "Kanagawa"

accent = "#7e9cd8"       # crystalBlue
background = "#1f1f28"   # sumiInk3
foreground = "#dcd7ba"   # fujiWhite

color0 = "#16161d"
