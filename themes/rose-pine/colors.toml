# Rosé Pine (main variant) — palette from rose-pine/rose-pine-theme
name = "Rosé Pine"

accent = "#eb6f92"       # love
background = "#191724"   # base
foreground = "#e0def4"   # text

# Terminal colors as in Rosé Pine's own terminal ports
color0 = "#26233a"   # overlay
color1 = "#eb6f92"   # love
color2 = "#31748f"   # pine
color3 = "#f6c177"   # gold
color4 = "#9ccfd8"   # foam
color5 = "#c4a7e7"   # iris
color6 = "#ebbcba"   # rose
color7 = "#e0def4"   # text
color8 = "#6e6a86"   # muted
color9 = "#eb6f92"
color10 = "#31748f"
color11 = "#f6c177"
color12 = "#9ccfd8"
color13 = "#c4a7e7"
color14 = "#ebbcba"
color15 = "#e0def4"

selection_background = "#403d52"  # highlight med

[ui]
surface = "#1f1d2e"    # surface
row_hover = "#21202e"  # highlight low
hover = "#26233a"      # overlay
border = "#403d52"     # highlight med
separator = "#524f67"  # highlight high
subtle = "#908caa"     # subtle
dim = "#908caa"
muted = "#6e6a86"      # muted
disabled = "#6e6a86"
placeholder = "#6e6a86"
urgent = "#eb6f92"
warning = "#f6c177"
success = "#9ccfd8"

# Same roles as rose-pine/neovim
[syntax]
keyword = "#31748f"
function = "#ebbcba"
type = "#9ccfd8"
string = "#f6c177"
number = "#f6c177"
regex = "#c4a7e7"
escape = "#c4a7e7"
attribute = "#c4a7e7"
variable = "#e0def4"
operator = "#908caa"
punctuation = "#908caa"
bracket = "#908caa"
comment = "#6e6a86"
line_nr = "#6e6a86"
visual = "#403d52"
special = "#eb6f92"

[gtk]
icon_theme = "Papirus-Dark"
gnome_accent = "pink"
