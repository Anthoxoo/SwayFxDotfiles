/* kitty/kitty.conf - Kitty terminal configuration */

# Include the color theme
include ./theme.conf

# ============================================
# Font
# ============================================
font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

# ============================================
# Window
# ============================================
window_border_width 1
window_border_width 0
draw_minimal_borders yes
window_margin_width 0
window_padding_width 0
hide_window_decorations no
remember_window_size yes

# ============================================
# Bells
# ============================================
enable_audio_bell no
visual_bell_duration 0

# ============================================
# Keyboard
# ============================================
clear_all_shortcuts yes
map super+return new_window
map super+n new_tab
map super+w close_window
map super+] next_window
map super+[ previous_window
map super+shift+] move_window_forward
map super+shift+[ move_window_backward

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

map ctrl+shift+equal increase_font_size
map ctrl+shift+minus decrease_font_size
map ctrl+shift+backspace restore_font_size
